<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoffeeGuard - Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #6E1E3A 0%, #8C2A4C 30%, #C22C5D 70%, #E23F73 100%);
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 80%;
            height: 200%;
            background: radial-gradient(ellipse at center, rgba(255,255,255,0.05) 0%, transparent 70%);
            transform: rotate(-15deg);
            pointer-events: none;
        }

        .leaf {
            position: fixed;
            pointer-events: none;
            opacity: 0.08;
            z-index: 0;
        }

        .leaf-1 { top: 5%; left: 5%; width: 120px; transform: rotate(-20deg); }
        .leaf-2 { bottom: 10%; right: 8%; width: 150px; transform: rotate(160deg); }
        .leaf-3 { top: 40%; left: 3%; width: 80px; transform: rotate(40deg); }
        .leaf-4 { bottom: 30%; right: 5%; width: 90px; transform: rotate(-120deg); }

        .login-box {
            position: relative;
            z-index: 1;
            background: white;
            padding: 50px 44px;
            border-radius: 24px;
            width: 400px;
            max-width: 92%;
            box-shadow: 0 30px 60px rgba(60, 10, 10, 0.35);
            text-align: center;
        }

        .brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 1.3rem;
            font-weight: 700;
            color: #E23F73;
            margin-bottom: 6px;
        }

        .login-box h2 {
            font-size: 1.8rem;
            color: #2B2430;
            margin-bottom: 4px;
        }

        .subtitle {
            color: #8D8494;
            font-size: 0.95rem;
            margin-bottom: 28px;
        }

        .field {
            position: relative;
            margin: 14px 0;
        }

        .field .icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            color: #8D8494;
        }

        .field input {
            width: 100%;
            padding: 14px 16px 14px 44px;
            border: 2px solid #EFDDE4;
            border-radius: 12px;
            outline: none;
            font-size: 0.95rem;
            background: #FEFAFB;
            transition: 0.25s ease;
        }

        .field input:focus {
            border-color: #E23F73;
            background: #fff;
            box-shadow: 0 0 0 4px rgba(226, 63, 115, 0.08);
        }

        .field input::placeholder {
            color: #B8A8B0;
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 16px 0 20px;
            font-size: 0.85rem;
        }

        .form-options label {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #8D8494;
            cursor: pointer;
        }

        .form-options label input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #E23F73;
            cursor: pointer;
        }

        .form-options a {
            color: #E23F73;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.85rem;
        }

        .form-options a:hover {
            color: #C22C5D;
            text-decoration: underline;
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: #E23F73;
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            font-size: 1rem;
            transition: 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-login:hover {
            background: #C22C5D;
            transform: translateY(-2px);
            box-shadow: 0 10px 28px rgba(194, 44, 93, 0.3);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 22px 0 18px;
            color: #8D8494;
            font-size: 0.8rem;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #EFDDE4;
        }

        .text {
            text-align: center;
            margin-top: 4px;
            font-size: 0.9rem;
            color: #8D8494;
        }

        .text a {
            color: #E23F73;
            text-decoration: none;
            font-weight: 700;
        }

        .text a:hover {
            color: #C22C5D;
            text-decoration: underline;
        }

        .error-msg {
            background: #FDE8EC;
            color: #C22C5D;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 0.85rem;
            margin-bottom: 12px;
            border-left: 4px solid #C22C5D;
            display: none;
            text-align: left;
        }

        .error-msg.show {
            display: block;
        }

        .success-msg {
            background: #E8F5E9;
            color: #2E7D32;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 0.85rem;
            margin-bottom: 12px;
            border-left: 4px solid #2E7D32;
            display: none;
            text-align: left;
        }

        .success-msg.show {
            display: block;
        }

        /* Loading spinner */
        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .btn-login.loading .btn-text {
            display: none;
        }

        .btn-login.loading .spinner {
            display: block;
        }

        @media (max-width: 480px) {
            .login-box { padding: 32px 20px; width: 95%; }
            .login-box h2 { font-size: 1.4rem; }
            .field input { padding: 12px 14px 12px 38px; font-size: 0.9rem; }
            .form-options { flex-direction: column; gap: 8px; align-items: flex-start; }
            .leaf-1, .leaf-2, .leaf-3, .leaf-4 { display: none; }
        }

        @media (max-width: 768px) {
            .leaf-1, .leaf-2, .leaf-3, .leaf-4 { width: 60px; }
        }
    </style>
</head>
<body>

    <!-- Coffee Leaf Decorations -->
    <svg class="leaf leaf-1" viewBox="0 0 120 180"><path d="M60 10 C90 30 104 80 88 130 C76 165 60 175 60 175 C60 175 44 165 32 130 C16 80 30 30 60 10Z" fill="#ffffff"/></svg>
    <svg class="leaf leaf-2" viewBox="0 0 120 180"><path d="M60 10 C90 30 104 80 88 130 C76 165 60 175 60 175 C60 175 44 165 32 130 C16 80 30 30 60 10Z" fill="#ffffff"/></svg>
    <svg class="leaf leaf-3" viewBox="0 0 100 150"><path d="M50 8 C75 25 86 65 73 108 C63 138 50 148 50 148 C50 148 37 138 27 108 C14 65 25 25 50 8Z" fill="#ffffff"/></svg>
    <svg class="leaf leaf-4" viewBox="0 0 100 150"><path d="M50 8 C75 25 86 65 73 108 C63 138 50 148 50 148 C50 148 37 138 27 108 C14 65 25 25 50 8Z" fill="#ffffff"/></svg>

    <!-- Login Box -->
    <div class="login-box">

        <div class="brand">☕ CoffeeGuard</div>
        <h2>Welcome back</h2>
        <p class="subtitle">Log in to keep an eye on your coffee plants</p>

        <!-- Success Message (for registration redirect) -->
        {% if success %}
        <div class="success-msg show">✅ {{ success }}</div>
        {% endif %}

        <!-- Error Message -->
        {% if error %}
        <div class="error-msg show">⚠️ {{ error }}</div>
        {% endif %}

        <form method="POST" action="/login_user" id="loginForm">
            <div class="field">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M22 6l-10 7L2 6"/>
                    <rect x="2" y="4" width="20" height="16" rx="2"/>
                </svg>
                <input type="email" name="email" placeholder="Email address" required autocomplete="email" value="{{ email or '' }}">
            </div>

            <div class="field">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="4" y="11" width="16" height="9" rx="2"/>
                    <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
                </svg>
                <input type="password" name="password" placeholder="Password" required autocomplete="current-password">
            </div>

            <div class="form-options">
                <label>
                    <input type="checkbox" name="remember"> Remember me
                </label>
                <a href="#">Forgot password?</a>
            </div>

            <button type="submit" class="btn-login" id="loginBtn">
                <span class="btn-text">Login</span>
                <span class="spinner"></span>
            </button>
        </form>

        <div class="divider">or</div>

        <div class="text">
            Don't have an account? <a href="/register">Create Account</a>
        </div>
    </div>

    <script>
        // Show error if login fails
        {% if error %}
        document.querySelector('.error-msg').classList.add('show');
        {% endif %}

        // Show success if registration was successful
        {% if success %}
        document.querySelector('.success-msg').classList.add('show');
        setTimeout(function() {
            const msg = document.querySelector('.success-msg');
            if (msg) msg.classList.remove('show');
        }, 5000);
        {% endif %}

        // Form validation with loading state
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            const email = document.querySelector('input[name="email"]').value.trim();
            const password = document.querySelector('input[name="password"]').value.trim();
            const errorMsg = document.querySelector('.error-msg');
            const btn = document.getElementById('loginBtn');

            // Clear previous error
            errorMsg.classList.remove('show');
            errorMsg.textContent = '';

            if (!email || !password) {
                e.preventDefault();
                errorMsg.textContent = '⚠️ Please fill in all fields.';
                errorMsg.classList.add('show');
                return false;
            }

            if (!email.includes('@') || !email.includes('.')) {
                e.preventDefault();
                errorMsg.textContent = '⚠️ Please enter a valid email address.';
                errorMsg.classList.add('show');
                return false;
            }

            // Show loading state
            btn.classList.add('loading');
            btn.disabled = true;

            return true;
        });

        // Auto-hide error after 5 seconds
        setTimeout(function() {
            const errorMsg = document.querySelector('.error-msg');
            if (errorMsg) {
                errorMsg.classList.remove('show');
            }
        }, 8000);
    </script>

</body>
</html>
